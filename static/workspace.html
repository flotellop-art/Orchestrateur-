<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Espace de travail multi-agents</title>
<style>
*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
:root {
  --bg: #f8f9fa; --white: #fff; --dark: #1a1a2e; --orange: #e8825a;
  --orange-d: #c96840; --green: #27ae60; --red: #e74c3c; --grey: #6c757d;
  --blue: #3a6ea5; --purple: #7b5ea7; --border: #dee2e6;
  --sh: 0 4px 20px rgba(0,0,0,.08); --r: 12px;
}
body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif;
  background: var(--bg); color: var(--dark); min-height: 100vh; }

header { background: var(--dark); color: #fff; padding: 16px 28px;
  display: flex; align-items: center; justify-content: space-between; }
header h1 { font-size: 1.15rem; font-weight: 700; }
header h1 span { color: var(--orange); }
header .turn { font-size: .82rem; color: #aaa; }

/* Setup */
.setup { max-width: 820px; margin: 36px auto 0; padding: 0 20px; }
.setup h2 { font-size: 1.5rem; margin-bottom: 6px; }
.setup h2 span { color: var(--orange); }
.setup p.sub { color: var(--grey); margin-bottom: 24px; }
.card { background: var(--white); border-radius: var(--r); box-shadow: var(--sh);
  padding: 24px; margin-bottom: 18px; }
label { display: block; font-weight: 600; font-size: .85rem; margin-bottom: 6px; }
textarea, input, select { width: 100%; border: 2px solid var(--border); border-radius: 9px;
  padding: 11px; font-size: .95rem; font-family: inherit; outline: none; transition: border-color .15s; }
textarea:focus, input:focus, select:focus { border-color: var(--orange); }
textarea { resize: vertical; min-height: 80px; line-height: 1.5; }
.row { display: flex; gap: 14px; flex-wrap: wrap; margin-top: 14px; }
.row > div { flex: 1; min-width: 130px; }
.checkbox-row { display: flex; align-items: center; gap: 9px; margin-top: 16px; }
.checkbox-row input { width: auto; }
.checkbox-row label { margin: 0; }
.seed-agent { display: flex; gap: 10px; margin-top: 10px; align-items: center; }
.seed-agent input, .seed-agent select { flex: 1; }
.btn { border: none; border-radius: 9px; padding: 11px 22px; font-size: .92rem;
  font-weight: 700; cursor: pointer; transition: background .15s, transform .1s; }
.btn:active { transform: scale(.98); }
.btn-primary { background: var(--orange); color: #fff; }
.btn-primary:hover { background: var(--orange-d); }
.btn-ghost { background: #f0f0f0; color: var(--dark); }
.btn-ghost:hover { background: #e4e4e4; }
.btn-small { padding: 7px 14px; font-size: .82rem; }
.btn-launch { width: 100%; padding: 15px; font-size: 1.05rem; margin-top: 4px; }
.muted { color: var(--grey); font-size: .8rem; }
.link-add { background: none; border: none; color: var(--orange); cursor: pointer;
  font-size: .85rem; font-weight: 600; margin-top: 10px; padding: 0; }

/* Live workspace */
.live { display: none; height: calc(100vh - 56px); }
.live.show { display: grid; grid-template-columns: 240px 1fr 360px; }
.panel { overflow-y: auto; padding: 16px; }
.panel-team { background: #f1f2f6; border-right: 1px solid var(--border); }
.panel-feed { background: var(--bg); }
.panel-files { background: #f1f2f6; border-left: 1px solid var(--border); }
.panel h3 { font-size: .76rem; text-transform: uppercase; letter-spacing: .6px;
  color: var(--grey); margin-bottom: 12px; }

.agent-card { background: var(--white); border-radius: 9px; padding: 11px 13px;
  margin-bottom: 9px; box-shadow: 0 1px 4px rgba(0,0,0,.06); border-left: 4px solid var(--blue); }
.agent-card .nm { font-weight: 700; font-size: .9rem; }
.agent-card .rl { color: var(--grey); font-size: .76rem; margin-top: 3px; line-height: 1.4; }
.agent-card .md { font-size: .68rem; color: var(--purple); margin-top: 5px; font-weight: 600; }

.controls { display: flex; gap: 7px; flex-wrap: wrap; margin-bottom: 16px;
  position: sticky; top: 0; background: var(--bg); padding-bottom: 10px; z-index: 5; }

.msg { background: var(--white); border-radius: 10px; padding: 11px 14px; margin-bottom: 9px;
  box-shadow: 0 1px 4px rgba(0,0,0,.05); font-size: .9rem; line-height: 1.5; }
.msg .who { font-weight: 700; font-size: .82rem; margin-bottom: 4px; }
.msg.chef { border-left: 4px solid var(--orange); }
.msg.chef .who { color: var(--orange-d); }
.msg.agent { border-left: 4px solid var(--blue); }
.msg.agent .who { color: var(--blue); }
.msg.result { border-left: 4px solid var(--green); }
.msg.tool { background: #f4f6f8; font-family: ui-monospace, monospace; font-size: .8rem; }
.msg.tool .who { color: var(--purple); }
.msg.sys { background: #fff8f0; color: var(--grey); font-size: .82rem; }
.msg.err { border-left: 4px solid var(--red); color: var(--red); }
.msg.turn { background: var(--dark); color: #fff; text-align: center; font-weight: 700;
  font-size: .8rem; padding: 7px; }
.msg pre { white-space: pre-wrap; word-break: break-word; margin-top: 6px;
  background: rgba(0,0,0,.04); padding: 8px; border-radius: 6px; max-height: 240px; overflow: auto; }
details summary { cursor: pointer; color: var(--grey); font-size: .8rem; }

.file-item { padding: 7px 10px; background: var(--white); border-radius: 7px; margin-bottom: 6px;
  cursor: pointer; font-size: .82rem; font-family: ui-monospace, monospace; word-break: break-all; }
.file-item:hover { background: var(--orange); color: #fff; }
.file-view { background: var(--dark); color: #e6e6e6; border-radius: 8px; padding: 12px;
  font-family: ui-monospace, monospace; font-size: .76rem; white-space: pre-wrap;
  word-break: break-word; max-height: 50vh; overflow: auto; margin-top: 10px; display: none; }
.file-view.show { display: block; }

.result-box { background: #eafaf1; border: 1px solid var(--green); border-radius: 10px;
  padding: 14px; margin-bottom: 12px; }
.result-box h4 { color: var(--green); margin-bottom: 6px; }
.badge { font-size: .72rem; padding: 2px 9px; border-radius: 12px; font-weight: 700; }
.badge.running { background: #eafaf1; color: var(--green); }
.badge.paused { background: #fff3e0; color: var(--orange-d); }
.badge.stopped { background: #f5f5f5; color: var(--grey); }
.badge.done { background: #eafaf1; color: var(--green); }
.badge.failed { background: #fdedec; color: var(--red); }
</style>
</head>
<body>

<header>
  <h1>Equipe d'<span>agents</span> autonomes</h1>
  <div><span class="turn" id="turn-info"></span> <span class="badge" id="status-badge" style="display:none"></span></div>
</header>

<!-- Configuration -->
<div class="setup" id="setup">
  <h2>Fixez un <span>objectif</span></h2>
  <p class="sub">Un chef autonome va constituer son equipe d'agents et la piloter jusqu'au resultat.</p>

  <div class="card">
    <label for="objective">Objectif</label>
    <textarea id="objective" placeholder="Ex : Concevoir et coder un petit jeu de devinette de nombre en Python, avec ses tests."></textarea>

    <div class="row">
      <div>
        <label for="chef-model">Modele du chef</label>
        <select id="chef-model">
          <option value="claude-sonnet-4-6">Claude Sonnet 4.6</option>
          <option value="claude-opus-4-6">Claude Opus 4.6</option>
          <option value="claude-haiku-4-5">Claude Haiku 4.5</option>
        </select>
      </div>
      <div>
        <label for="max-agents">Nombre max d'agents</label>
        <input type="number" id="max-agents" value="4" min="1" max="8">
      </div>
      <div>
        <label for="max-iter">Nombre max de tours</label>
        <input type="number" id="max-iter" value="15" min="1" max="40">
      </div>
    </div>

    <div class="checkbox-row">
      <input type="checkbox" id="web-enabled" checked>
      <label for="web-enabled">Autoriser la recherche web</label>
    </div>
  </div>

  <div class="card">
    <label>Amorcer des agents (optionnel)</label>
    <p class="muted">Laissez vide pour que le chef cree toute l'equipe lui-meme.</p>
    <div id="seed-agents"></div>
    <button class="link-add" onclick="addSeed()">+ Ajouter un agent</button>
  </div>

  <button class="btn btn-primary btn-launch" id="btn-launch" onclick="launch()">Lancer l'equipe</button>
  <p class="muted" id="launch-err" style="color:var(--red);margin-top:10px"></p>
</div>

<!-- Espace de travail live -->
<div class="live" id="live">
  <div class="panel panel-team">
    <h3>Equipe</h3>
    <div id="team-list"><p class="muted">En attente du chef...</p></div>
  </div>

  <div class="panel panel-feed">
    <div class="controls">
      <button class="btn btn-ghost btn-small" id="btn-pause" onclick="ctrl('pause')">Pause</button>
      <button class="btn btn-ghost btn-small" id="btn-resume" onclick="ctrl('resume')" style="display:none">Reprendre</button>
      <button class="btn btn-ghost btn-small" id="btn-step" onclick="ctrl('step')">Etape</button>
      <button class="btn btn-ghost btn-small" onclick="ctrl('stop')">Arreter</button>
      <button class="btn btn-ghost btn-small" onclick="newTask()">Nouvel objectif</button>
    </div>
    <div id="result-area"></div>
    <div id="feed"></div>
  </div>

  <div class="panel panel-files">
    <h3>Fichiers produits</h3>
    <div id="file-list"><p class="muted">Aucun fichier pour l'instant.</p></div>
    <div class="file-view" id="file-view"></div>
  </div>
</div>

<script>
var taskId = null;
var evtSource = null;
var seedCount = 0;
var teamNames = {};

function esc(s) {
  if (s === null || s === undefined) return '';
  return String(s).replace(/&/g,'&amp;').replace(/</g,'&lt;').replace(/>/g,'&gt;').replace(/"/g,'&quot;');
}

// ── Setup ───────────────────────────────────────────────────────────────────
function addSeed() {
  seedCount++;
  var div = document.createElement('div');
  div.className = 'seed-agent';
  div.id = 'seed-' + seedCount;
  div.innerHTML =
    '<input placeholder="Nom" data-f="name">'
    + '<input placeholder="Role / specialite" data-f="role">'
    + '<select data-f="model"><option value="claude">Claude</option><option value="gemini">Gemini</option></select>'
    + '<button class="btn btn-ghost btn-small" onclick="this.parentNode.remove()">x</button>';
  document.getElementById('seed-agents').appendChild(div);
}

function collectSeeds() {
  var out = [];
  document.querySelectorAll('.seed-agent').forEach(function(div) {
    var name = div.querySelector('[data-f=name]').value.trim();
    if (!name) return;
    out.push({
      name: name,
      role: div.querySelector('[data-f=role]').value.trim(),
      model: div.querySelector('[data-f=model]').value
    });
  });
  return out;
}

async function launch() {
  var objective = document.getElementById('objective').value.trim();
  var errEl = document.getElementById('launch-err');
  errEl.textContent = '';
  if (!objective) { errEl.textContent = 'Indiquez un objectif.'; return; }

  var body = {
    objective: objective,
    chef_model: document.getElementById('chef-model').value,
    agents: collectSeeds(),
    web_enabled: document.getElementById('web-enabled').checked,
    max_iterations: parseInt(document.getElementById('max-iter').value) || 15,
    max_agents: parseInt(document.getElementById('max-agents').value) || 4
  };

  document.getElementById('btn-launch').disabled = true;
  try {
    var r = await fetch('/api/tasks', {
      method: 'POST', headers: {'Content-Type': 'application/json'}, body: JSON.stringify(body)
    });
    if (!r.ok) { throw new Error((await r.json()).detail || 'Erreur'); }
    var d = await r.json();
    taskId = d.id;
    await fetch('/api/tasks/' + taskId + '/start', {method: 'POST'});
    startLive();
  } catch(e) {
    errEl.textContent = 'Erreur : ' + e.message;
    document.getElementById('btn-launch').disabled = false;
  }
}

// ── Live ──────────────────────────────────────────────────────────────────────
function startLive() {
  document.getElementById('setup').style.display = 'none';
  document.getElementById('live').classList.add('show');
  document.getElementById('feed').innerHTML = '';
  document.getElementById('team-list').innerHTML = '<p class="muted">En attente du chef...</p>';
  document.getElementById('result-area').innerHTML = '';
  teamNames = {};
  setStatus('running');
  connectStream();
  refreshFiles();
}

function connectStream() {
  if (evtSource) evtSource.close();
  evtSource = new EventSource('/api/tasks/' + taskId + '/stream');
  evtSource.onmessage = function(e) {
    var ev;
    try { ev = JSON.parse(e.data); } catch(_) { return; }
    handleEvent(ev);
  };
  evtSource.onerror = function() { /* le navigateur retente automatiquement */ };
}

function feedAdd(html) {
  var feed = document.getElementById('feed');
  var div = document.createElement('div');
  div.innerHTML = html;
  feed.appendChild(div.firstChild);
  feed.parentNode.scrollTop = feed.parentNode.scrollHeight;
}

function handleEvent(ev) {
  switch (ev.type) {
    case 'turn_start':
      document.getElementById('turn-info').textContent = 'Tour ' + ev.iteration;
      feedAdd('<div class="msg turn">— Tour ' + ev.iteration + ' —</div>');
      break;
    case 'chef':
      var ins = ev.instruction ? ('<div><b>Consigne :</b> ' + esc(ev.instruction) + '</div>') : '';
      feedAdd('<div class="msg chef"><div class="who">Chef &middot; ' + esc(ev.decision) + '</div>'
        + (ev.thought ? '<div>' + esc(ev.thought) + '</div>' : '') + ins + '</div>');
      break;
    case 'agent_created':
      addTeamCard(ev.name, ev.role, ev.model);
      feedAdd('<div class="msg sys">Nouvel agent : <b>' + esc(ev.name) + '</b> (' + esc(ev.role) + ')</div>');
      break;
    case 'agent_message':
      var cls = ev.kind === 'result' ? 'result' : 'agent';
      feedAdd('<div class="msg ' + cls + '"><div class="who">' + esc(ev.agent)
        + (ev.kind === 'result' ? ' &middot; resultat' : '') + '</div><div>' + esc(ev.content) + '</div></div>');
      break;
    case 'tool_call':
      feedAdd('<div class="msg tool"><div class="who">' + esc(ev.agent) + ' &rarr; ' + esc(ev.tool)
        + '</div><pre>' + esc(JSON.stringify(ev.input)) + '</pre></div>');
      break;
    case 'tool_result':
      feedAdd('<div class="msg tool"><details><summary>' + esc(ev.tool)
        + ' : resultat</summary><pre>' + esc(ev.output) + '</pre></details></div>');
      break;
    case 'files_changed':
      renderFiles(ev.list);
      break;
    case 'info':
      feedAdd('<div class="msg sys">' + esc(ev.msg) + '</div>');
      break;
    case 'paused': setStatus('paused'); break;
    case 'resumed': setStatus('running'); break;
    case 'stopped': setStatus('stopped'); break;
    case 'done':
      document.getElementById('result-area').innerHTML =
        '<div class="result-box"><h4>Objectif termine</h4><div>' + esc(ev.summary) + '</div></div>';
      setStatus('done');
      break;
    case 'error':
      feedAdd('<div class="msg err">Erreur : ' + esc(ev.msg) + '</div>');
      setStatus('failed');
      break;
    case 'end':
      if (evtSource) evtSource.close();
      if (ev.status && ev.status !== 'done') setStatus(ev.status);
      break;
  }
}

function addTeamCard(name, role, model) {
  if (teamNames[name]) return;
  teamNames[name] = true;
  var list = document.getElementById('team-list');
  if (list.querySelector('.muted')) list.innerHTML = '';
  var div = document.createElement('div');
  div.className = 'agent-card';
  div.innerHTML = '<div class="nm">' + esc(name) + '</div><div class="rl">' + esc(role)
    + '</div><div class="md">' + esc(model) + '</div>';
  list.appendChild(div);
}

function setStatus(s) {
  var labels = {running:'En cours', paused:'En pause', stopped:'Arrete', done:'Termine', failed:'Echec'};
  var b = document.getElementById('status-badge');
  b.style.display = '';
  b.className = 'badge ' + s;
  b.textContent = labels[s] || s;
  document.getElementById('btn-pause').style.display = (s === 'running') ? '' : 'none';
  document.getElementById('btn-resume').style.display = (s === 'paused') ? '' : 'none';
}

async function ctrl(action) {
  if (!taskId) return;
  await fetch('/api/tasks/' + taskId + '/' + action, {method: 'POST'});
  if (action === 'pause') setStatus('paused');
  if (action === 'resume') setStatus('running');
}

// ── Fichiers ──────────────────────────────────────────────────────────────────
async function refreshFiles() {
  if (!taskId) return;
  try {
    var d = await (await fetch('/api/tasks/' + taskId + '/files')).json();
    renderFiles(d.files);
  } catch(e) {}
}

function renderFiles(files) {
  var el = document.getElementById('file-list');
  if (!files || !files.length) { el.innerHTML = '<p class="muted">Aucun fichier pour l\'instant.</p>'; return; }
  el.innerHTML = files.map(function(f) {
    return '<div class="file-item" onclick="viewFile(\'' + esc(f).replace(/'/g, "\\'") + '\')">' + esc(f) + '</div>';
  }).join('');
}

async function viewFile(path) {
  try {
    var d = await (await fetch('/api/tasks/' + taskId + '/file?path=' + encodeURIComponent(path))).json();
    var v = document.getElementById('file-view');
    v.textContent = d.content;
    v.classList.add('show');
  } catch(e) {}
}

function newTask() {
  if (evtSource) evtSource.close();
  taskId = null;
  document.getElementById('live').classList.remove('show');
  document.getElementById('setup').style.display = '';
  document.getElementById('btn-launch').disabled = false;
  document.getElementById('status-badge').style.display = 'none';
  document.getElementById('turn-info').textContent = '';
}
</script>
</body>
</html>
